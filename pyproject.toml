[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "branchwrite"
version = "0.1.0.dev67"
description = "Branch-aware coding client for Context COW"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["prompt_toolkit==3.0.52", "Pillow==13.0.0", "reportlab==5.0.1", "pypdfium2==5.14.0", "pypdf==6.21.1"]

[project.scripts]
branchwrite = "branchwrite.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["branchwrite*"]
