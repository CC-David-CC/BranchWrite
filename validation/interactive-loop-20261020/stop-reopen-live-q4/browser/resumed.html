<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Dogs</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7fbff;
      --card: #ffffff;
      --ink: #17324d;
      --muted: #5b7186;
      --accent: #ff8a5c;
      --accent-2: #5cc8ff;
      --shadow: 0 10px 30px rgba(23, 50, 77, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #17233b;
        --ink: #eaf2ff;
        --muted: #b7c7da;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(92, 200, 255, 0.28), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(255, 138, 92, 0.24), transparent 32rem),
        var(--bg);
      line-height: 1.55;
    }
    main {
      width: min(100% - 1.5rem, 42rem);
      margin-inline: auto;
      padding: 1.25rem 0 2rem;
    }
    header {
      padding: 1rem 0 0.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .subtitle {
      margin: 0.75rem auto 0;
      max-width: 34rem;
      color: var(--muted);
      font-size: clamp(1rem, 3.5vw, 1.15rem);
    }
    .paw {
      font-size: clamp(2.5rem, 10vw, 4rem);
      line-height: 1;
    }
    .cards {
      display: grid;
      gap: 0.85rem;
      margin-top: 1.25rem;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(23, 50, 77, 0.08);
      border-radius: 1.25rem;
      box-shadow: var(--shadow);
      padding: 1rem;
    }
    .card h2 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
    }
    .card p {
      margin: 0;
      color: var(--muted);
    }
    .hello {
      margin-top: 1.25rem;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(23, 50, 77, 0.08);
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
      padding: 1.1rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.9rem 1.35rem;
      font: inherit;
      font-weight: 700;
      color: #10233a;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      box-shadow: 0 8px 20px rgba(92, 200, 255, 0.28);
      cursor: pointer;
      min-height: 44px;
    }
    button:focus-visible {
      outline: 3px solid #ffd166;
      outline-offset: 3px;
    }
    #helloMessage {
      min-height: 1.5rem;
      margin: 0.85rem 0 0;
      font-weight: 700;
      color: var(--ink);
    }
    footer {
      margin-top: 1.25rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="paw" aria-hidden="true">🐾</div>
      <h1>Happy Dogs</h1>
      <p class="subtitle">A tiny, phone-friendly page about good dogs and happy days.</p>
    </header>

    <section class="cards" aria-label="Dog notes">
      <article class="card">
        <h2>Milo</h2>
        <p>Milo plays.</p>
      </article>
      <article class="card">
        <h2>Luna</h2>
        <p>Luna runs.</p>
      </article>
    </section>

    <section class="hello" aria-label="Greeting">
      <button id="helloButton" type="button">Say hello</button>
      <p id="helloMessage" role="status" aria-live="polite"></p>
    </section>

    <footer>
      <p>Everything lives in this one page.</p>
    </footer>
  </main>

  <script>
    document.getElementById('helloButton').addEventListener('click', function () {
      document.getElementById('helloMessage').textContent = 'Hello, David!';
    });
  </script>
</body>
</html>
