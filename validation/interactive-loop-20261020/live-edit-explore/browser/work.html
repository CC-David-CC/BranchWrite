<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Notes</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.6;
      background: #f6f8fb;
      color: #1f2937;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.25rem;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1.5rem rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin-top: 0;
      color: blue;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.2;
    }
    p {
      font-size: 1.05rem;
    }
    button {
      display: block;
      width: 100%;
      min-height: 3rem;
      margin: 1.25rem 0;
      border: 0;
      border-radius: 0.75rem;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
    }
    button:active {
      transform: translateY(1px);
    }
    #fact {
      min-height: 1.5rem;
      padding: 0.75rem;
      border-radius: 0.75rem;
      background: #eef2ff;
      color: #1e3a8a;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bird Notes</h1>
    <p>Birds are wonderful neighbors.</p>
    <button id="factButton" type="button">Show a bird fact</button>
    <p id="fact" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('factButton').addEventListener('click', function () {
      document.getElementById('fact').textContent = 'Birds have feathers.';
    });
  </script>
</body>
</html>
