<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Notes</title>
  <style>
    :root {
      --purple: #7c3aed;
      --ink: #1f2937;
      --soft: #f5f3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: linear-gradient(135deg, #f5f3ff, #eef2ff);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 34rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #ddd6fe;
      border-radius: 1.25rem;
      box-shadow: 0 12px 32px rgba(76, 29, 149, 0.12);
      padding: clamp(1.25rem, 4vw, 2.25rem);
    }

    h1 {
      margin: 0 0 0.75rem;
      color: purple;
      font-size: clamp(2rem, 8vw, 3.25rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 1.25rem;
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
    }

    button {
      min-height: 44px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      background: var(--purple);
      color: white;
      font: inherit;
      font-weight: 700;
      padding: 0.85rem 1.25rem;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #6d28d9;
      outline: 3px solid #c4b5fd;
      outline-offset: 2px;
    }

    #fact {
      min-height: 1.75rem;
      margin-top: 1rem;
      color: #5b21b6;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bird Notes</h1>
    <p>Birds are wonderful neighbors.</p>
    <button type="button" onclick="document.getElementById('fact').textContent='Birds have feathers.'">Show a bird fact</button>
    <p id="fact" aria-live="polite"></p>
  </main>
</body>
</html>
